# AI kit project values. Template/user-owned: edit values here, then rerun install/upgrade to re-render managed files.
schemaVersion: "1"
projectName: "app-configs"
projectType: "dotfiles-config-repo"
projectSummary: "Personal dev-environment manager (dotfiles, CLI, GUI, runtimes) via chezmoi + mise + Nix/Home Manager + nix-darwin/Homebrew + Lefthook"
primaryLanguage: "Bash + Nix"
primaryRuntime: "chezmoi + mise + Nix/Home Manager"
primaryEntrypoints: "README.md, ops/install.sh, ops/bootstrap.sh, mise.toml, nix/flake.nix"
primaryVerifyCommand: "bash ops/validate-config.sh"
primaryBuildCommand: "mise run repo:check"
primaryTestCommand: "mise run test:bash"
# Optional project-fact values (uncomment to override kit defaults):
targetPlatforms: "macOS, Linux desktop, Linux CLI/headless, WSL2 (CLI/dev only)"
sourceDirs: "home/, nix/, ops/"
testDirs: "tests/bash"
testCommand: "mise run test:bash"
buildCommand: "mise run repo:check"
lintCommand: "mise run lint:shell"
formatCommand: "mise run nix:fmt"
installCommand: "bash ops/install.sh"
packageManager: "mise + Nix (Home Manager) + Homebrew (macOS)"
ciCommands: "mise run repo:check"
protectedPaths: "nix/, ops/install.sh, ops/system-setup.sh, ops/uninstall.sh, .lefthook.yml, home/personal.yaml.example"
generatedFiles: "docs/ai/generated/, result, result-*, scc-by-file*.csv"
protectedFiles: "home/.chezmoidata/personal.yaml, home/.chezmoidata/personal.local.yaml, nix/flake.lock"
reviewPriorities: "correctness, secrets leakage, idempotency of install/apply, host-profile compatibility, chezmoi/nix template drift"
riskAreas: "chezmoi templates, nix flake modules, install/update/cleanup scripts, NixOS system layer, secrets in personal.yaml"
approvalRequiredChanges: "secrets, destructive changes, NixOS system layer (sys-setup), install/apply scripts, uninstall actions"
inactivePaths: "repo-docs/archive/, repo-docs/migration-*.md"
availableCapabilities: "project-context, verify-change, review-diff"
primaryStack: "chezmoi (dotfiles) + mise (runtimes/tasks) + Nix/Home Manager (CLI pkgs) + nix-darwin/Homebrew (macOS GUI) + Lefthook (git hooks)"
filePlacementRules: "Dotfiles/app config under home/ (chezmoi source); Nix host/package modules under nix/; install/setup/maintenance scripts under ops/; bats tests under tests/bash; extended docs under repo-docs/"
namingRules: "chezmoi source naming (dot_*, *.tmpl); kebab-case ops/*.sh; mise tasks namespaced with ':' (e.g. repo:check); nix modules under nix/modules/<platform|home>/"
goldenExamples: "ops/validate-config.sh, ops/install.sh, mise.toml, nix/flake.nix, home/dot_gitconfig.tmpl, tests/bash/detect-os-disks.bats"
formatterConfigFiles: ".editorconfig, .prettierrc.json, .stylelintrc.json"
linterConfigFiles: ".eslintrc.json, .stylelintrc.json, .lefthook.yml"
editorconfigPath: ".editorconfig"
ignoreFiles: ".gitignore, .gitattributes, .repomixignore"
