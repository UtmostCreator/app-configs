# Runs the same checks as `mise run ci:local`: repo invariants, bash -n on
# every shell script + ShellCheck, the whole bats suite, native
# `nix flake check`, `nix flake check --all-systems --no-build` (evaluates
# aarch64-darwin and every host), and a native build of the
# linux-cli and wsl activation packages (linux-desktop is evaluated only).
# Tools come from the flake-pinned nixpkgs
# (ops/ci-packages.txt) in a clean environment, so a pass here means the
# same as a pass on your machine with ops/ci-local.sh.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run CI checks (clean env, pinned tools)
        run: bash ops/ci-local.sh
