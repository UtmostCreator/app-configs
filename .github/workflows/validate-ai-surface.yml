name: Validate AI Surface

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate root AI workflow files
        run: php tools/ai/validate-ai-config.php

      - name: Validate manifest and catalog metadata
        run: php tools/ai/validate-ai-catalog.php

      - name: Check generated docs drift
        run: php tools/ai/generate-ai-catalog.php --check

      - name: Validate generated artifact policy
        run: php tools/ai/validate-generated-artifacts.php

      - name: Validate install surface references
        run: php tools/ai/validate-install-surface.php --strict

      - name: Validate adapter drift on changed files
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: php tools/ai/validate-adapter-drift.php --changed-only --fail-on-warn

      - name: Check starter bundle definitions
        run: php tools/ai/export-ai-universal-rules.php --check

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # shellcheck on tracked .sh files. `--no-run-if-empty` keeps xargs
      # from invoking shellcheck with no args (exit 123) when a kit-only
      # install has zero shell files.
      - name: Lint shell scripts
        run: git ls-files '*.sh' | xargs --no-run-if-empty shellcheck -x

      # actionlint runs against .github/workflows/. If a clone has no
      # workflows the binary still passes (it just finds nothing to lint).
      - name: Lint GitHub Actions workflows
        run: actionlint

  test-php:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Detect a PHP project. The validate-ai-surface workflow ships with
      # `test-php` ready to run, but this repository (and any kit-only
      # installs) has no composer.json. Without this guard the job
      # composer-installs an empty directory and fails on every push,
      # making the whole workflow permanently red.
      #
      # The job runs only when composer.json exists at repo root.
      # Drop a real composer.json with a phpunit dev-dep and CI starts
      # exercising it automatically — no workflow edit required.
      - name: Detect PHP test project
        id: detect
        run: |
          if [[ -f composer.json ]]; then
            echo "has_php=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_php=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No composer.json at repo root; skipping PHP tests."
          fi

      - name: Setup PHP
        if: steps.detect.outputs.has_php == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        if: steps.detect.outputs.has_php == 'true'
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        if: steps.detect.outputs.has_php == 'true'
        run: |
          if [[ -x vendor/bin/phpunit ]]; then
            vendor/bin/phpunit --colors=never
          else
            echo "::warning::composer.json exists but vendor/bin/phpunit is missing; skipping."
          fi
