pre-commit:
  parallel: false
  commands:
    no-personal-yaml:
      run: bash ops/hooks/no-personal-yaml.sh
    shared-precommit:
      run: bash ops/hooks/pre-commit.sh

pre-push:
  commands:
    validate-config:
      run: bash ops/validate-config.sh
    shared-prepush:
      use_stdin: true
      run: bash ops/hooks/pre-push.sh

post-merge:
  commands:
    drift-hints:
      run: bash ops/hooks/post-merge.sh

commit-msg:
  commands:
    shared-commit-msg:
      run: bash ops/hooks/commit-msg.sh {1}
