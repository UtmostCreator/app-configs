pre-commit:
  parallel: false
  commands:
    no-personal-yaml:
      run: |
        staged="$(git diff --cached --name-only | grep -E '^home/\.chezmoidata/(personal|personal\.local|projects)\.yaml$' || true)"
        if [ -n "$staged" ]; then
          echo "ERROR: private per-host data is staged: $staged"
          echo "It contains real identity, hosts or paths and must never be committed."
          echo "Run: git restore --staged $staged"
          exit 1
        fi
    shared-precommit:
      run: bash ops/hooks/pre-commit.sh

pre-push:
  commands:
    validate-config:
      run: bash ops/validate-config.sh
    shared-prepush:
      use_stdin: true
      run: bash ops/hooks/pre-push.sh

post-merge:
  commands:
    drift-hints:
      run: bash ops/hooks/post-merge.sh

commit-msg:
  commands:
    shared-commit-msg:
      run: bash ops/hooks/commit-msg.sh {1}
