version: 1
default_decision: ask

tiers:
  base-readonly:
    description: Read-only discovery and evidence gathering.
    edit: deny
    bash:
      allow:
        - "command -v *"
        - "test -f *"
        - "test -x *"
        - "test -d *"
        - "stat *"
        - "pwd"
        - "date *"
        - "git status --short"
        - "git diff --stat*"
        - "git diff --name-only*"
        - "git diff --shortstat*"
        - "git diff --numstat*"
        - "git ls-files*"
        - "git rev-parse*"
        - "git branch*"
        - "AI_OUTPUT=json bash scripts/ai/ai-search.sh *"
        - "env AI_OUTPUT=json bash scripts/ai/ai-search.sh *"
        - "AI_OUTPUT=json bash scripts/ai/preview-file.sh *"
        - "env AI_OUTPUT=json bash scripts/ai/preview-file.sh *"
        - "bash scripts/ai/rg-code.sh *"
        - "bash scripts/ai/fd-files.sh *"
        - "bash scripts/ai/query-usage.sh *"
        - "bash scripts/ai/git-forensics.sh *"
      ask:
        - "rg *"
        - "fd *"
        - "git grep *"
        - "git diff*"
        - "git log*"
        - "git show*"
        - "git blame*"
        - "jq *"
      deny:
        - "grep *"
        - "find *"
        - "cat *"
        - "sed *"
        - "awk *"
        - "rm *"
        - "mv *"
        - "cp *"
        - "chmod *"
        - "chown *"
        - "curl *"
        - "wget *"
        - "ssh *"
        - "npm install*"
        - "pnpm install*"
        - "yarn add*"
        - "composer install*"
        - "composer update*"
        - "git reset*"
        - "git clean*"
        - "git push*"
        - "bash scripts/ai/ai-search.sh secrets *"
        - "AI_ALLOW_UNSAFE=1 bash scripts/ai/ai-search.sh *"

  base-verify:
    extends: base-readonly
    description: Read-only validation and static checks.
    bash:
      allow:
        - "php -l *"
        - "shellcheck *"
        - "shfmt -d *"
        - "markdownlint-cli2 *"
        - "actionlint *"
        - "php tools/ai/validate-*.php *"
        - "php tools/ai/generate-*.php --check*"
        - "composer validate*"
        - "composer show*"
        - "composer depends*"
        - "composer check-platform-reqs"
      ask:
        - "composer audit*"
        - "npm audit*"
        - "pnpm audit*"

  base-impl:
    extends: base-verify
    description: Focused implementation and verification.
    bash:
      allow:
        - "vendor/bin/phpunit *"
        - "./vendor/bin/phpunit *"
        - "phpunit *"
        - "vendor/bin/pest *"
        - "./vendor/bin/pest *"
        - "vendor/bin/pint --test*"
        - "bash scripts/ai/ai-verify.sh *"
        - "bash scripts/ai/ai-test-select.sh *"
        - "bash scripts/ai/ai-diff-context.sh *"
        - "bash scripts/ai/pack-context.sh *"
        - "bash scripts/ai/repomix-context-tree.sh analyze *"
        - "bash scripts/ai/repomix-context-tree.sh plan *"
      ask:
        - "npm test*"
        - "npm run test*"
        - "npm run lint*"
        - "npm run typecheck*"
        - "pnpm test*"
        - "pnpm run test*"
        - "pnpm run lint*"
        - "pnpm run typecheck*"
        - "git commit*"
        - "git stash push*"
        - "git stash pop*"
        - "git stash drop*"
        - "APPLY=1 bash scripts/ai/ai-edit.sh *"
        - "VERIFY=1 bash scripts/ai/ai-edit.sh *"
        - "bash scripts/ai/ai-rollback.sh apply *"
        - "bash scripts/ai/ai-rollback.sh prune *"

  install-maintenance:
    extends: base-verify
    description: Temporary install/upgrade mode for repository-delivered AI install and verification scripts.
    bash:
      allow:
        - "AI_OUTPUT=json bash scripts/ai/ai-search.sh changed * . --fixed"
        - "AI_OUTPUT=json bash scripts/ai/ai-search.sh staged * . --fixed"
        - "AI_OUTPUT=json bash scripts/ai/ai-search.sh tracked * . --fixed"
        - "bash scripts/ai/ai-search.sh changed * . --fixed"
        - "bash scripts/ai/ai-search.sh staged * . --fixed"
        - "bash scripts/ai/ai-search.sh tracked * . --fixed"
        - "php tools/ai/maintenance-mode.php *"
        - "php tools/ai/ai.php install * --dry-run"
        - "php tools/ai/ai.php install * --apply"
        - "php tools/ai/install-ai-kit.php *"
        - "php tools/ai/validate-command-policy.php *"
        - "php tools/ai/validate-ai-config.php"
        - "php tools/ai/validate-install-surface.php"
        - "php tools/ai/validate-ai-catalog.php"
        - "php tools/ai/generate-ai-catalog.php --check"
        - "php tools/ai/verify-full-install.php"
        - "php tools/ai/ai.php advisor --all"
        - "bash scripts/ai/run-repomix-context.sh *"
        - "bash scripts/ai/repomix-context-tree.sh all *"
      ask:
        - "bash *.sh *"
