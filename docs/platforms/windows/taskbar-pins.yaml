# Taskbar pins, in the owner's order (left to right). Documentation only: nothing reads or applies this file.
# Pinning is a manual checklist (see taskbar.md). Owner decisions 2026-11-16: "also add yaml and if we can setup this task panel pinned";
# "keepass and sync thing goes before putty"; HeidiSQL is kept as a permanent Windows exception.
#
# status: chosen (decided tool) | system (part of Windows) | pending tool decision (tool-selection ADRs 0021 to 0033, in progress) | unknown
# aumid: AppUserModelID where known; otherwise a path with {PF} = %ProgramFiles%. Empty when unknown.
# profiles: personal | work | both (omitted = both). The `personal` assignments are proposed (from tool ADR screening), not decided.
# aumid values come from Get-StartApps output on this PC (2026-11-16); `{PF}` and `%APPDATA%` entries are executable paths.

