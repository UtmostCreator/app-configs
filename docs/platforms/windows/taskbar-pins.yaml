# Taskbar pins, in the owner's order (left to right). Read by ops/windows/taskbar.ps1 (ADR-0044); see taskbar.md.
# Owner decisions 2026-11-16: "also add yaml and if we can setup this task panel pinned";
# "keepass and sync thing goes before putty"; HeidiSQL is kept as a permanent Windows exception.
# Owner request 2026-11-21: pin the installed apps that are available, and a script to unpin Copilot, Edge and Outlook.
#
# status: chosen (decided tool) | system (part of Windows) | pending tool decision (tool-selection ADRs 0021 to 0033, in progress) | unknown
# aumid: AppID as Get-StartApps prints it (an AppUserModelID, a {known-folder-guid}\path or a %VAR%\path).
#   Empty = taskbar.ps1 looks the app up by its Start menu name (`app`). Values come from Get-StartApps on this PC (2026-11-21).
# winget: package id in ops/windows/winget/<profile>.json. taskbar.ps1 pins a `chosen` row only when this id is in the
#   profile's manifest and the app is installed. `system` rows with an aumid are pinned in both profiles. Other statuses never are.
# profiles: personal | work | both (omitted = both). A `personal` row's winget id must not be in work.json
#   (tests/bash/windows-winget-manifests.bats).
# Format: one `key: value` scalar per line, so the PowerShell reader stays small.

pins:
