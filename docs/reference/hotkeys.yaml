follow_ups:
  - id: windows_adr
    text: "Automating any Windows hotkey (Keyboard Manager settings, FancyZones, Raycast hotkeys, Flameshot config) needs a new ADR tagged windows that cites ADR-0019, plus an explicit owner decision. ADR-0011 forbids hotkey scripts and AutoHotkey. Until then every Windows row is manual and proposed."
  - id: karabiner_rectangle_to_raycast
    text: "Karabiner calls rectangle:// URLs for Win+Shift+Left/Right, Win+Shift+Up and Win+Shift+Down (karabiner.json:3030, :3065, :3083), but Rectangle is not installed by the repo. The owner chose Raycast window commands. Change those rules later; not done here. The Win+Up rule (:2972) matches vk_none and never fires (Raycast Cmd+Up runs); removing it is cleanup only."
  - id: karabiner_and_keyboard_md_right_cmd
    text: "karabiner.json rule descriptions and keyboard.md call the Win key Right Cmd, but every rule triggers on left_command or left_gui. Fix the descriptions in karabiner.json and the text in keyboard.md later; not done here."
  - id: raycast_shortcuts_relation
    text: "reference/raycast/shortcuts.yaml is the auditable Raycast reference (not a native import). This table reuses its values and should be updated when that file changes; no tooling reads either file, so drift is possible."
  - id: browser_choice
    text: "Browser key conflict: macOS Alt+F1 opens Firefox, NixOS F1 opens Brave. Owner to pick the browser and key."
  - id: alt_shift_layout_toggle
    text: "On Windows, Alt+Shift toggles the input language by default and can interfere with the Alt+Shift app family. Disabling it is a manual Windows setting."
