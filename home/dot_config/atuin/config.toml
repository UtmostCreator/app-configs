# Atuin shell history config. Only non-default settings are kept here.
# Full annotated reference: https://docs.atuin.sh/configuration/config/

# Local-only history: do not sync to a server.
auto_sync = false
sync_frequency = 0

# Press Enter to run the selected command immediately (not just paste it).
enter_accept = true

[sync]
# Use the newer record-based sync format (harmless while auto_sync is off).
records = true
