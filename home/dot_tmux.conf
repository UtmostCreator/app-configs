# ── Terminal & colour ─────────────────────────────────────────────────────────
set -s default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"
# Undercurl support (Neovim, etc.)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── Catppuccin theme ─────────────────────────────────────────────────────────
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# Window tab content: index · name  (pane count shown when > 1)
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_text " #W#{?window_zoomed_flag, 󰁌,}#{?#{>:#{window_panes},1}, ·#{window_panes}p,}"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag, 󰁌,}#{?#{>:#{window_panes},1}, ·#{window_panes}p,}"
set -g @catppuccin_window_flags "none"

# Status bar layout — modules loaded after TPM init
set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100

# ── Core settings ─────────────────────────────────────────────────────────────
set -g prefix C-s
set -g escape-time 0
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g history-limit 100000
set -g set-clipboard on
set -g focus-events on
set -g allow-rename off
set -g automatic-rename off

# ── Copy mode (vi keys + pbcopy) ──────────────────────────────────────────────
set -g mode-keys vi
# Enter copy mode on scroll up
bind -T root WheelUpPane if-shell -F '#{alternate_on}' 'send-keys -M' 'copy-mode -e'
# Keyboard select + copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe "pbcopy"
bind -T copy-mode-vi C-Insert send -X copy-pipe "pbcopy"
# Double-click selects word (default tmux behaviour, restored explicitly)
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ── Key bindings ──────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
bind X kill-pane

# Splits & new windows keep current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Plugins (TPM) ─────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'christoomey/vim-tmux-navigator'

# resurrect: restore Neovim sessions too
set -g @resurrect-strategy-nvim 'session'
# continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Initialize TPM (must be last line)
run '~/.tmux/plugins/tpm/tpm'

# ── Status bar modules (must come after TPM/catppuccin loads) ─────────────────
run '~/.tmux/plugins/tmux/status/session.conf'
run '~/.tmux/plugins/tmux/status/directory.conf'
run '~/.tmux/plugins/tmux/status/date_time.conf'

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"
