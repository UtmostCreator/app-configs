# Tool versions are intentionally NOT pinned in the repo mise.toml so that
# repo tasks (doctor, lint, sync, etc.) work on any host without forcing a
# specific PHP build. Per-user runtime pins live under
# `home/dot_config/mise/config.toml.tmpl` (chezmoi-managed) so each machine
# picks its own version without polluting this shared file.
#
# If you need a strict per-repo PHP/Node/etc. pin (e.g. for CI), uncomment
# and set the version below.
#
# [tools]
# php = "8.4"

# ─── Read-only helpers ───────────────────────────────────────────────────────

[tasks.doctor]
description = "Run repo health checks"
run = "bash ops/doctor.sh"

[tasks.diff]
description = "Preview chezmoi changes (no mutation)"
run = "chezmoi diff"

[tasks."lint:check"]
description = "Whitespace and repository lint checks"
run = "git diff --check"

[tasks."lint:shell"]
description = "Shell syntax + ShellCheck for migration scripts"
run = """
set -e
bash -n ops/bootstrap.sh ops/detect-host.sh ops/snapshot-home.sh \
        ops/validate-config.sh ops/check-source-of-truth.sh \
        ops/generate-package-matrix.sh ops/doctor.sh \
        ops/install.sh ops/update-all.sh ops/cleanup.sh \
        ops/readiness.sh ops/system-setup.sh ops/vscode-extensions.sh \
        ops/detect-os-disks.sh ops/syncthing-obsidian-stignore.sh 2>/dev/null || \
  echo 'missing: one or more scripts not yet created (Phase 7)'
if command -v shellcheck >/dev/null 2>&1; then
  shellcheck ops/snapshot-home.sh ops/validate-config.sh \
              ops/check-source-of-truth.sh ops/generate-package-matrix.sh \
              ops/doctor.sh ops/install.sh ops/update-all.sh \
              ops/cleanup.sh ops/readiness.sh ops/system-setup.sh \
              ops/vscode-extensions.sh \
              ops/detect-os-disks.sh ops/syncthing-obsidian-stignore.sh
  for f in ops/bootstrap.sh ops/detect-host.sh; do
    [ -f "$f" ] && shellcheck "$f"
  done
else
  echo 'missing: shellcheck (skip lint; install via Nix per Phase 6 matrix)'
fi
"""

[tasks."test:bash"]
description = "Run bats tests for shell scripts (deterministic, no live hardware)"
run = """
if command -v bats >/dev/null 2>&1; then
  bats tests/bash
else
  echo 'missing: bats (install via Nix); skipping shell tests'
fi
"""

[tasks."repo:validate"]
description = "Architecture invariant guard"
run = "bash ops/validate-config.sh"

[tasks."repo:check"]
description = "Combined config consistency check"
run = """
set -e
git diff --check
bash ops/doctor.sh
bash ops/validate-config.sh
if command -v nix >/dev/null 2>&1 && [ -d nix ]; then
  nix flake check ./nix
else
  echo 'missing: nix or nix/ flake (skip flake check)'
fi
"""

# ─── chezmoi-only apply (no Nix/mise/lefthook side effects) ─────────────────

[tasks.apply]
description = "Apply chezmoi changes only (no Nix/mise/lefthook side effects)"
run = """
set -e
if ! command -v chezmoi >/dev/null 2>&1; then
  echo 'missing: chezmoi (install via nix profile or ops/bootstrap.sh --yes)'
  exit 1
fi
chezmoi diff
printf 'Apply chezmoi changes? [y/N] '
read -r ans
[ "$ans" = "y" ] || [ "$ans" = "Y" ] || { echo 'Aborted'; exit 1; }
if [ -x ops/snapshot-home.sh ]; then
  bash ops/snapshot-home.sh
else
  echo 'missing: ops/snapshot-home.sh'
  exit 1
fi
chezmoi apply
"""

# ─── Sync semantics: default safe preview, explicit apply path ──────────────

[tasks."sync:dry-run"]
description = "Preview full sync (chezmoi + HM/darwin + mise + lefthook) without mutating"
run = """
set -e
HOST="${HOST_PROFILE:-}"
if [ -z "$HOST" ] && [ -x ops/detect-host.sh ]; then
  HOST="$(bash ops/detect-host.sh 2>/dev/null || echo unknown)"
fi
echo "=== Host: ${HOST:-unknown} ==="
echo
echo '=== chezmoi diff ==='
if command -v chezmoi >/dev/null 2>&1; then chezmoi diff; else echo 'missing: chezmoi'; fi
echo
echo '=== home-manager / darwin-rebuild dry-run ==='
case "$HOST" in
  macos)
    if command -v darwin-rebuild >/dev/null 2>&1; then
      darwin-rebuild check --flake ./nix#macos
    else
      echo 'missing: darwin-rebuild'
    fi
    ;;
  linux-desktop|linux-cli|wsl)
    if command -v home-manager >/dev/null 2>&1 && [ -d nix ]; then
      home-manager switch --flake "./nix#$HOST" --dry-run
    else
      echo 'missing: home-manager or nix/ flake'
    fi
    ;;
  *)
    echo 'unknown host profile; set HOST_PROFILE=macos|linux-desktop|linux-cli|wsl'
    ;;
esac
echo
echo '=== mise install (advisory) ==='
if command -v mise >/dev/null 2>&1; then
  mise ls --missing 2>/dev/null || echo 'mise has nothing to install'
else
  echo 'missing: mise'
fi
echo
echo '=== VS Code extensions dry-run ==='
if [ -x ops/vscode-extensions.sh ]; then
  bash ops/vscode-extensions.sh --dry-run
else
  echo 'missing: ops/vscode-extensions.sh'
fi
echo
echo 'Would run: lefthook install'
"""

[tasks."sync:apply"]
description = "Apply full sync: snapshot + chezmoi + HM/darwin + mise + lefthook"
run = """
set -e
HOST="${HOST_PROFILE:-}"
if [ -z "$HOST" ] && [ -x ops/detect-host.sh ]; then
  HOST="$(bash ops/detect-host.sh)"
fi
case "$HOST" in
  macos|linux-desktop|linux-cli|wsl) ;;
  *) echo "unsupported HOST_PROFILE: $HOST"; exit 1 ;;
esac

for cmd in chezmoi mise lefthook; do
  command -v "$cmd" >/dev/null 2>&1 || { echo "missing: $cmd"; exit 1; }
done

chezmoi diff
printf 'Apply full sync on host=%s? [y/N] ' "$HOST"
read -r ans
[ "$ans" = "y" ] || [ "$ans" = "Y" ] || { echo 'Aborted'; exit 1; }

if [ -x ops/snapshot-home.sh ]; then
  bash ops/snapshot-home.sh
else
  echo 'missing: ops/snapshot-home.sh'; exit 1
fi

chezmoi apply

case "$HOST" in
  macos)
    command -v darwin-rebuild >/dev/null 2>&1 || { echo 'missing: darwin-rebuild'; exit 1; }
    darwin-rebuild switch --flake ./nix#macos
    ;;
  *)
    command -v home-manager >/dev/null 2>&1 || { echo 'missing: home-manager'; exit 1; }
    home-manager switch --flake "./nix#$HOST"
    ;;
esac

mise install
bash ops/vscode-extensions.sh
lefthook install
"""

[tasks."vscode:extensions"]
description = "Install curated VS Code extensions shipped with this config"
run = "bash ops/vscode-extensions.sh"

[tasks."vscode:extensions:dry-run"]
description = "Preview missing curated VS Code extensions"
run = "bash ops/vscode-extensions.sh --dry-run"

[tasks.sync]
description = "Default safe sync preview (alias for sync:dry-run)"
run = "mise run sync:dry-run"

# ─── Bootstrap convenience ──────────────────────────────────────────────────

[tasks.bootstrap]
description = "Cold-start: ops/bootstrap.sh (default dry-run)"
run = "bash ops/bootstrap.sh"

# ─── One-shot install / update / cleanup (set-and-forget) ───────────────────

[tasks.install]
description = "Fully-automated unattended install (NixOS-aware). DRY_RUN=1 to preview."
run = "bash ops/install.sh"

[tasks.update]
description = "Update everything (flake inputs, HM, chezmoi, mise) + safe cleanup. Report-only; add -- --apply."
run = "bash ops/update-all.sh"

[tasks."update:apply"]
description = "Apply the full update unattended (brewup equivalent)"
run = "bash ops/update-all.sh --apply --yes"

[tasks.readiness]
description = "Am I all set? Verify everything is installed + usable; reports what's left"
run = "bash ops/readiness.sh"

[tasks."detect-os-disks"]
description = "Read-only scan: which disk has Windows/Linux + suggested dual-boot config (no changes)"
run = "bash ops/detect-os-disks.sh"

[tasks."system:setup"]
description = "Report the NixOS system snippet (fish login shell + trusted-users + gc). Apply with: sudo bash ops/system-setup.sh --apply"
run = "bash ops/system-setup.sh"

[tasks.cleanup]
description = "Safe non-destructive cleanup (store optimise + cache prune). Report-only; add -- --apply."
run = "bash ops/cleanup.sh"

[tasks."cleanup:apply"]
description = "Run safe cleanup now (keeps all rollback generations)"
run = "bash ops/cleanup.sh --apply --yes"

[tasks."cleanup:gc"]
description = "Cleanup + reclaim aged generations older than KEEP_DAYS (default 14d; keeps recent)"
run = "bash ops/cleanup.sh --apply --yes --gc"

# ─── Nix flake helpers ──────────────────────────────────────────────────────

[tasks."nix:check"]
description = "Validate Nix flake"
run = "nix flake check ./nix"

[tasks."nix:show"]
description = "Show flake outputs"
run = "nix flake show ./nix"

[tasks."nix:fmt"]
description = "Format all Nix files (nixfmt RFC style)"
run = "nixfmt nix/*.nix nix/**/*.nix"

[tasks."nix:lint"]
description = "Lint Nix config (statix + deadnix); warnings are advisory"
run = """
set -e
echo '=== statix ==='
if command -v statix >/dev/null 2>&1; then statix check nix/ || true; else echo 'missing: statix'; fi
echo '=== deadnix ==='
if command -v deadnix >/dev/null 2>&1; then deadnix nix/ || true; else echo 'missing: deadnix'; fi
echo '=== nixfmt --check ==='
if command -v nixfmt >/dev/null 2>&1; then nixfmt --check nix/*.nix nix/**/*.nix; else echo 'missing: nixfmt'; fi
"""

# ─── Optional convenience tools (opt-in) ────────────────────────────────────
# Recommended terminal helpers. Not installed by default — run the task
# below or `mise install aqua:wagoodman/dive` etc. on demand.
#
# Installed via aqua (prebuilt binaries; no host build deps required).
# See repo-docs/software-and-cli-tools.md for what each one does.
#
# Where the pins land: a dedicated TOML at
#   ~/.config/mise/conf.d/optional-tools.toml
# mise auto-loads every TOML under ~/.config/mise/conf.d/, so the shims
# work without touching ~/.config/mise/config.toml. The chezmoi-managed
# template (home/dot_config/mise/config.toml.tmpl) writes to
# ~/.config/mise/config.toml; isolating opt-in pins prevents the two
# from clobbering each other.

[tasks."tools:optional:install"]
description = "Install + pin opt-in convenience tools (dive, fx, navi, glow, gum) to ~/.config/mise/conf.d/optional-tools.toml"
run = """
set -e
config_dir="${HOME}/.config/mise/conf.d"
config_file="${config_dir}/optional-tools.toml"
mkdir -p "$config_dir"
if [ ! -f "$config_file" ]; then
  printf '%s\\n' '# Generated by mise run tools:optional:install. Safe to delete.' >"$config_file"
fi
for tool in \
  aqua:wagoodman/dive \
  aqua:antonmedv/fx \
  aqua:denisidoro/navi \
  aqua:charmbracelet/glow \
  aqua:charmbracelet/gum
do
  echo "=== mise use --path $config_file $tool ==="
  mise use --path "$config_file" "$tool"
done
echo
echo "Done. Pins written to $config_file."
echo "Binaries are available via mise shims (mise activate <shell>) on next shell start,"
echo "or run them directly under $HOME/.local/share/mise/shims/."
"""

[tasks."tools:optional:list"]
description = "List the opt-in convenience tools and their install state"
run = """
for tool in dive fx navi glow gum; do
  if command -v "$tool" >/dev/null 2>&1; then
    printf '  %-8s %s\\n' "$tool" "$(command -v "$tool")"
  else
    printf '  %-8s missing (run: mise run tools:optional:install)\\n' "$tool"
  fi
done
"""

# ─── Project orchestrator (opt-in) ──────────────────────────────────────────
# Per-host project list lives in home/.chezmoidata/projects.yaml (gitignored).
# Render it into ~/.config/projects/config.yaml via `chezmoi apply` (or
# `mise run sync:apply`). Then any of these tasks just work.

[tasks."projects:tmux"]
description = "Open the master tmux workspace (one pane per project + logs + services)"
run = "bash ops/projects/tmux-master.sh"

[tasks."projects:logs"]
description = "Open the N-pane log viewer for projects with service.log set"
run = "bash ops/projects/tmux-logs.sh"

[tasks."projects:ssh"]
description = "Open one tmux pane per SSH host listed in projects.yaml"
run = "bash ops/projects/tmux-ssh.sh"

[tasks."projects:repo"]
description = "Run repo-checks for one project (usage: mise run projects:repo -- <project-id>)"
run = "bash ops/projects/repo-checks.sh"

[tasks."projects:health"]
description = "Run every check in ops/projects/health/checks.d/ and pretty-print"
run = "bash ops/projects/health/run.sh"

[tasks."projects:health:json"]
description = "Run health checks and emit raw JSON (for scripting / dashboards)"
run = "bash ops/projects/health/run.sh --json"

[tasks."projects:sync-main"]
description = "Fetch + fast-forward 'main' on every project (or one: -- <project-id>)"
run = "bash ops/projects/github/sync-main.sh"

[tasks."projects:pr-watch"]
description = "Poll GitHub for PR transitions on tracked repos (--once for single poll)"
run = "bash ops/projects/github/pr-watch.sh"

