# Base services consumed only through `extends`; never pass this file with -f.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-infra: &infra
  init: true
  logging: *logging
  security_opt:
    - no-new-privileges:true

# Lets non-root processes keep listening on port 80 without setcap or root.
x-unprivileged-ports: &unprivileged-ports
  net.ipv4.ip_unprivileged_port_start: 0

services:

  infra:
    <<: *infra
    mem_limit: ${DEVSTACK_INFRA_MEMORY_LIMIT:-512m}

  php:
    <<: *infra
    mem_limit: ${DEVSTACK_PHP_MEMORY_LIMIT:-1g}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    sysctls: *unprivileged-ports

  nginx:
    <<: *infra
    mem_limit: ${DEVSTACK_NGINX_MEMORY_LIMIT:-256m}
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    sysctls: *unprivileged-ports
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tools:
    init: true
    logging: *logging
    security_opt:
      - no-new-privileges:true
    mem_limit: ${DEVSTACK_TOOLS_MEMORY_LIMIT:-1g}
    cap_drop: [ALL]
    tmpfs:
      - /tmp
